<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SPA con History API</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #242424;
    --accent: #5eead4;
    --text: #e6e6e6;
    --muted: #999;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  nav {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid #333;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 14px;
    transition: background 0.15s, color 0.15s;
  }
  nav a:hover { background: #333; color: var(--text); }
  nav a.active { color: var(--bg); background: var(--accent); font-weight: 600; }
  main {
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p { color: var(--muted); line-height: 1.6; }
  code {
    background: #333;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .card {
    background: var(--panel);
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    margin-top: 16px;
  }
  button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  .note {
    font-size: 13px;
    color: var(--muted);
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<nav id="nav">
  <a href="/" data-route="/">Inicio</a>
  <a href="/about" data-route="/about">Acerca</a>
  <a href="/usuario/42" data-route="/usuario/42">Usuario 42</a>
</nav>

<main id="app"></main>

<script>
  // 1. Definimos rutas. Las dinámicas usan ":param" como placeholder.
  const routes = [
    { path: '/', render: () => `
      <h1>Inicio</h1>
      <p>Esta versión usa <code>history.pushState()</code> en vez de hashes,
      así que la URL se ve limpia: <code>/about</code> en vez de
      <code>#/about</code>.</p>
    `},
    { path: '/about', render: () => `
      <h1>Acerca de</h1>
      <p>Los clicks en los links se interceptan con <code>preventDefault()</code>
      para no disparar una recarga real, y en su lugar llamamos a
      <code>pushState</code>.</p>
    `},
    { path: '/usuario/:id', render: (params) => `
      <h1>Usuario ${params.id}</h1>
      <div class="card">
        <p>Esta ruta es dinámica: <code>/usuario/:id</code>.</p>
        <p>El id capturado de la URL es <strong>${params.id}</strong>.</p>
      </div>
    `},
  ];

  const notFound = () => `<h1>404</h1><p>Esa ruta no existe.</p>`;

  const app = document.getElementById('app');

  // 2. Matcher: compara la ruta actual contra el patrón de cada ruta definida
  function matchRoute(path) {
    for (const route of routes) {
      const paramNames = [];
      const pattern = route.path.replace(/:([^/]+)/g, (_, name) => {
        paramNames.push(name);
        return '([^/]+)';
      });
      const match = path.match(new RegExp(`^${pattern}$`));
      if (match) {
        const params = {};
        paramNames.forEach((name, i) => (params[name] = match[i + 1]));
        return { route, params };
      }
    }
    return null;
  }

  function render() {
    const path = location.pathname;
    const result = matchRoute(path);

    app.innerHTML = result ? result.route.render(result.params) : notFound();

    document.querySelectorAll('#nav a').forEach(link => {
      link.classList.toggle('active', link.dataset.route === path);
    });
  }

  // 3. Navegación programática: cambia la URL sin recargar
  function navigate(path) {
    history.pushState(null, '', path);
    render();
  }

  // 4. Interceptamos los clicks en los <a> internos
  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[data-route]');
    if (!link) return;
    e.preventDefault();
    navigate(link.getAttribute('href'));
  });

  // 5. El botón "atrás/adelante" del navegador dispara "popstate"
  window.addEventListener('popstate', render);
  window.addEventListener('DOMContentLoaded', render);
</script>

</body>
</html>
